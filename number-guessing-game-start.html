<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">

    <title>Jogo de adivinhação de números</title>

    <style>
      html {
        font-family: sans-serif;
      }

      body {
        width: 50%;
        max-width: 800px;
        min-width: 480px;
        margin: 0 auto;
      }
      
      .formulario input[type="number"] {
        width: 200px;
      }

      .ultimoResultado {
        color: white;
        padding: 3px;
      }
    </style>
  </head>

  <body>
    <h1>Jogo de adivinhação de números</h1>

    <p>Selecionamos um número aleatório entre 1 e 100. Veja se você consegue adivinhar em 10 tentativas ou menos. Nós diremos se seu palpite foi muito alto ou muito baixo.</p>

    <div class="formulario">
      <label for="campoPalpite">Digite um palpite: </label>
      <input type="number" min="1" max="100" required id="campoPalpite" class="campoPalpite">
      <input type="submit" value="Enviar palpite" class="envioPalpite">
    </div>

    <div class="paragrafosResultado">
      <p class="palpites"></p>
      <p class="ultimoResultado"></p>
      <p class="baixoOuAlto"></p>
    </div>

    <script>
      let numeroAleatorio = Math.floor(Math.random() * 100) + 1;
      const palpites = document.querySelector('.palpites');
      const ultimoResultado = document.querySelector('.ultimoResultado');
      const baixoOuAlto = document.querySelector('.baixoOuAlto');
      const envioPalpite = document.querySelector('.envioPalpite');
      const campoPalpite = document.querySelector('.campoPalpite');
      let contagemPalpites = 1;
      let botaoReiniciar;

      function verificarPalpite() {
        const palpiteUsuario = Number(campoPalpite.value);
        if (contagemPalpites === 1) {
          palpites.textContent = 'Palpites anteriores: ';
        }

        palpites.textContent += palpiteUsuario + ' ';

        if (palpiteUsuario === numeroAleatorio) {
          ultimoResultado.textContent = 'Parabéns! Você acertou!';
          ultimoResultado.style.backgroundColor = 'green';
          baixoOuAlto.textContent = '';
          finalizarJogo();
        } else if (contagemPalpites === 10) {
          ultimoResultado.textContent = '!!!FIM DE JOGO!!!';
          baixoOuAlto.textContent = '';
          finalizarJogo();
        } else {
          ultimoResultado.textContent = 'Errado!';
          ultimoResultado.style.backgroundColor = 'red';
          if (palpiteUsuario < numeroAleatorio) {
            baixoOuAlto.textContent = 'O último palpite foi muito baixo!';
          } else if (palpiteUsuario > numeroAleatorio) {
            baixoOuAlto.textContent = 'O último palpite foi muito alto!';
          }
        }

        contagemPalpites++;
        campoPalpite.value = '';
        campoPalpite.focus();
      }

      envioPalpite.addEventListener('click', verificarPalpite);

      function finalizarJogo() {
        campoPalpite.disabled = true;
        envioPalpite.disabled = true;
        botaoReiniciar = document.createElement('button');
        botaoReiniciar.textContent = 'Iniciar novo jogo';
        document.body.appendChild(botaoReiniciar);
        botaoReiniciar.addEventListener('click', reiniciarJogo);
      }

      function reiniciarJogo() {
        contagemPalpites = 1;
        const paragrafosReiniciar = document.querySelectorAll('.paragrafosResultado p');
        for (const paragrafoReiniciar of paragrafosReiniciar) {
          paragrafoReiniciar.textContent = '';
        }

        botaoReiniciar.parentNode.removeChild(botaoReiniciar);
        campoPalpite.disabled = false;
        envioPalpite.disabled = false;
        campoPalpite.value = '';
        campoPalpite.focus();
        ultimoResultado.style.backgroundColor = 'white';
        numeroAleatorio = Math.floor(Math.random() * 100) + 1;
      }
    </script>
  </body>
</html>
